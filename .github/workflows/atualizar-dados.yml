name: Atualizar dados do Corinthians

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências da coleta
        run: python -m pip install requests

      - name: Executar a coleta (football-data.org)
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          TEMPORADA: ${{ vars.TEMPORADA || '2026' }}
        run: |
          python coleta_football_data.py
          python coleta_tabela.py
          python coleta_artilharia.py
          python simulacao.py

      - name: Conferir se a base tem jogos
        run: |
          linhas=$(($(wc -l < corinthians_serie_a_2026_todos_jogos.csv) - 1))
          echo "Jogos na base: $linhas"
          if [ "$linhas" -lt 1 ]; then
            echo "::error::A coleta não retornou jogos. Verifique a chave."
            exit 1
          fi

      - name: Publicar a base atualizada
        run: |
          ARQUIVOS="corinthians_serie_a_2026_todos_jogos.csv tabela_serie_a.csv artilharia_corinthians.csv simulacao_serie_a.csv simulacao_posicoes_corinthians.csv"
          if git diff --quiet -- $ARQUIVOS; then
            echo "Nenhuma novidade. Nada a publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $ARQUIVOS
          git commit -m "Atualiza dados do Corinthians ($(date -u +'%Y-%m-%d'))"
          git push
